<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Más Dueños TV</title>
<link rel="stylesheet" href="./tv.css">
<script type="module" src="./tv.js"></script>
</head>
<body>
<main id="app">
  <div id="slides" aria-label="Presentación Liniers"></div>
  <section id="loading" class="screen">
    <div class="eyebrow">MÁS DUEÑOS · LINIERS</div>
    <h1>Preparando presentación</h1>
    <p id="message" role="status">Abriendo PowerPoint desde la copia guardada…</p>
    <div class="spinner" aria-hidden="true"></div>
  </section>
  <section id="ready" class="screen" hidden>
    <div class="eyebrow">PRESENTACIÓN COMERCIAL · ANDROID TV</div>
    <h1>Todo listo</h1>
    <p id="summary">Presentación almacenada en este televisor.</p>
    <button id="start" type="button" autofocus>▶ Iniciar presentación</button>
    <p class="tip">OK / Enter para comenzar · Tab o OK inicia la introducción en la diapositiva 1</p>
  </section>
  <section id="intro" hidden aria-label="Video introductorio">
    <video id="intro-video" playsinline preload="none" disablepictureinpicture disableremoteplayback></video>
  </section>
  <div id="hint" role="status" aria-live="polite" hidden></div>
</main>
</body>
</html>
