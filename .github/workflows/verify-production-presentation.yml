name: Verify production presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-presentation.yml'
      - 'src/official-presentation.js'
      - 'src/server.js'
      - 'public/js/presentation.js'
      - 'src/intro-video.js'
      - 'public/js/presentation-remote.js'
      - 'views/presentation.ejs'
      - 'public/js/presentation-wake-lock.js'
      - 'public/js/presentation-source.js'
      - 'public/js/presentation-cache.js'
      - 'public/js/presentation-intro-cache.js'
      - 'public/css/presentation.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed file, SHA-256 and browser launch from the default card
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';

          const base = 'https://masduenos.laind.io';
          const url = base + '/assets/presentaciones/mas-duenos-liniers.pptx';
          const sha = 'bdb35bfa366b7c2570a36a0d5b1172836765d50796a8e772345b5a5ccf6f25c7';
          const bytes = 34796967;
          let ready = false;
          for (let attempt=1; attempt<=12; attempt++) {
            try {
              const response = await fetch(url, {method:'HEAD', cache:'no-store',signal:AbortSignal.timeout(25000)});
              const mime = response.headers.get('content-type') || '';
              console.log(`Production HEAD attempt ${attempt}: HTTP ${response.status}, ${mime}`);
              if (response.ok && mime.includes('application/vnd.openxmlformats-officedocument.presentationml.presentation')) {
                ready = true;
                break;
              }
            } catch (error) {
              console.log(`Production HEAD attempt ${attempt}: ${error.message}`);
            }
            if (attempt<12) await new Promise(resolve => setTimeout(resolve,15000));
          }
          assert.ok(ready, 'Production did not expose the verified PPTX within the retry window');

          // Deploys can momentarily serve the app's 200/HTML warming page, even after a valid HEAD.
          let verified = false;
          for (let attempt=1; attempt<=15; attempt++) {
            try {
              const response = await fetch(url, {signal:AbortSignal.timeout(120000), cache:'no-store'});
              const mime = response.headers.get('content-type') || '';
              const data = Buffer.from(await response.arrayBuffer());
              console.log(`Production GET attempt ${attempt}: HTTP ${response.status}, ${mime}, ${data.length} bytes`);
              if (response.ok && mime.includes('application/vnd.openxmlformats-officedocument.presentationml.presentation') && data.length === bytes) {
                assert.equal(createHash('sha256').update(data).digest('hex'),sha,'PPTX bytes differ from original');
                verified = true;
                break;
              }
            } catch (error) {
              console.log(`Production GET attempt ${attempt}: ${error.message}`);
            }
            if (attempt<15) await new Promise(resolve => setTimeout(resolve,10000));
          }
          assert.ok(verified, 'Production GET never returned the complete original PPTX');
          console.log('Production GET: exact SHA-256, 40-slide PPTX source bytes verified.');

          // The user will upload this file to Hostinger later. 404 is
          // expected until then; do not claim that it is already working.
          const introUrl=base+'/assets/presentaciones/introduccion.mp4';
          const introResponse=await fetch(introUrl,{method:'HEAD',cache:'no-store',signal:AbortSignal.timeout(30000)});
          if(introResponse.status===404){
            console.log('Introduction MP4: pending manual upload to Hostinger (expected HTTP 404).');
          }else{
            assert.equal(introResponse.status,200,'intro endpoint must return MP4 or HTTP 404 if not yet uploaded');
            assert.match(introResponse.headers.get('content-type')||'',/video\/mp4/,
              'the intro endpoint must not send a 200 HTML warmup page');
            assert.ok(Number(introResponse.headers.get('content-length'))>12,
              'the complete MP4 is required');
            console.log('Introduction MP4: production HEAD returns valid video/mp4 headers.');
          }

          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.addInitScript(() => {
              window.__screenWakeLog={requests:0,releases:0};
              Object.defineProperty(navigator,'wakeLock',{configurable:true,value:{
                request:async type=>{
                  if(type!=='screen') throw Error('Unexpected wake type');
                  window.__screenWakeLog.requests++;
                  const sentinel=new EventTarget();
                  sentinel.release=async()=>{
                    window.__screenWakeLog.releases++;
                    sentinel.dispatchEvent(new Event('release'));
                  };
                  return sentinel;
                },
              }});
            });
            page.on('pageerror',error => console.error('Browser error:',error.message));
            // The real introduction can still be absent in Hostinger.
            // Mock just its HTTP bytes to verify persistent MP4 caching in a
            // production browser, without changing the uploaded PPTX.
            const fakeIntro = Buffer.concat([
              Buffer.from([0,0,0,24]), Buffer.from('ftypisom'),Buffer.alloc(16),
            ]);
            let introDownloads=0;
            await page.route('**/assets/presentaciones/introduccion.mp4',route=>{
              const method=route.request().method();
              console.log('Introduction intercepted browser request:',method);
              if(method==='HEAD')return route.fulfill({
                status:200,contentType:'video/mp4',
                headers:{etag:'"intro-smoke-v1"','content-length':String(fakeIntro.length)},
              });
              introDownloads++;
              return route.fulfill({
                status:200,contentType:'video/mp4',body:fakeIntro,
                headers:{etag:'"intro-smoke-v1"','content-length':String(fakeIntro.length)},
              });
            });

            let pageReady = false;
            for (let attempt=1; attempt<=8; attempt++) {
              const result=await page.goto(base+'/presentacion',{waitUntil:'domcontentloaded',timeout:60000});
              if (result?.status()===200 && await page.locator('#dropzone').isVisible()) {
                pageReady = true;
                break;
              }
              console.log(`Presentation page not ready (attempt ${attempt})`);
              if (attempt<8) await new Promise(resolve => setTimeout(resolve,10000));
            }
            assert.ok(pageReady,'presentation page must load after deployment');
            await page.waitForFunction(() => document.querySelector('#default-availability')?.textContent?.includes('Lista para abrir'),null,{timeout:60000});
            const introStoredBeforeClick = await page.evaluate(async() => {
              const store=await caches.open('salon-mas-duenos-introduccion-mp4-v1');
              return Boolean(await store.match('/assets/presentaciones/introduccion.mp4'));
            });
            console.log('Introduction already cached before card click:',introStoredBeforeClick);
            await page.locator('#open-default').click();
            await page.waitForFunction(async() => {
              const store=await caches.open('salon-mas-duenos-introduccion-mp4-v1');
              return Boolean(await store.match('/assets/presentaciones/introduccion.mp4'));
            },null,{timeout:30000});
            console.log('Introduction total intercepted MP4 GET requests:',introDownloads);
            if(!introStoredBeforeClick){
              assert.equal(introDownloads,1,
                'opening Liniers must trigger the MP4 GET when cache is initially empty');
            }
            await page.waitForFunction(() =>
              document.querySelector('#intro-cache-progress')?.dataset.state==='ready',
              null,{timeout:30000});
            assert.equal(await page.locator('#intro-cache-progress').getAttribute('data-state'),'ready',
              'visual indicator must show ready only after successful Cache Storage');
            assert.match(await page.locator('#intro-cache-stage').textContent(),/guardado y listo/);
            assert.equal(await page.locator('#intro-cache-meter').getAttribute('value'),'100');
            console.log('Introduction caching: full MP4 persisted after Liniers card opened.');
            await page.locator('#workspace').waitFor({state:'visible',timeout:120000});
            await page.waitForFunction(() => /40 diapositivas/.test(document.querySelector('#file-meta')?.textContent||''),null,{timeout:120000});
            assert.equal(await page.locator('#file-name').textContent(),'Nueva - Más dueños.pptx');
            assert.equal(await page.locator('#start').isVisible(),true);
            console.log('Browser: default card opens the 40-slide deck without file selection; upload card remains available.');

            // Real-deck regression: slide 21 contains playFrom(0), not two
            // physical slides. One advance plays Geraldine, the next leaves.
            await page.locator('#start').click();
            await page.waitForFunction(() => Boolean(document.fullscreenElement),null,{timeout:15000});
            await page.waitForFunction(() => window.__screenWakeLog.requests===1,null,{timeout:15000});
            assert.equal(await page.evaluate(()=>window.__screenWakeLog.releases),0,
              'wake lock remains active during fullscreen');
            // Diagnostic: identify the viewer's fullscreen-only floating toolbar
            // without logging slide contents or user data.
            await page.mouse.move(700,700);
            await page.mouse.move(700,18);
            await page.waitForTimeout(550);
            const floatingChrome = await page.evaluate(() => {
              const full=document.fullscreenElement;
              const all=[...document.querySelectorAll('[class*="pptxv"],[role="toolbar"]')];
              return {
                fullscreen:full?.className || full?.tagName,
                matches:all.filter(el=>{
                  const cls=typeof el.className==='string' ? el.className : '';
                  if (!/(toolbar|control|presentation|slideshow|presenter|overlay)/i.test(cls)) return false;
                  const style=getComputedStyle(el);
                  const bounds=el.getBoundingClientRect();
                  return style.display!=='none' && style.visibility!=='hidden' &&
                    bounds.width>0 && bounds.height>0 && bounds.top<innerHeight && bounds.bottom>0;
                }).slice(0,45).map(el=>({
                  tag:el.tagName,cls:String(el.className).slice(0,200),
                  role:el.getAttribute('role'),parent:String(el.parentElement?.className||'').slice(0,90),
                  top:Math.round(el.getBoundingClientRect().top),
                })),
              };
            });
            console.log('Fullscreen presentation chrome diagnostic:',JSON.stringify(floatingChrome));
            const presentationToolbar=page.locator('.pptxv.pptxv-presenting .pptxv-present-toolbar-wrap');
            await presentationToolbar.waitFor({state:'attached',timeout:15000});
            await page.mouse.move(800,700);
            await page.mouse.move(800,20);
            await page.waitForTimeout(650);
            assert.equal(await presentationToolbar.evaluate(node=>getComputedStyle(node).display),'none',
              'floating fullscreen toolbar must remain hidden on mouse movement');
            console.log('Fullscreen controls: toolbar remains hidden after pointer movement.');
            for (let index=1;index<=20;index++) {
              await page.keyboard.press('ArrowDown');
              await page.waitForFunction(i => document.querySelector('#pptx-host')?.dataset.activeSlideIndex===String(i),
                index,{timeout:30000});
            }
            assert.equal(await page.locator('#pptx-host').getAttribute('data-active-slide-index'),'20');
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(1100);
            assert.equal(await page.locator('#pptx-host').getAttribute('data-active-slide-index'),'20',
              'first advance on video slide must play without changing slides');
            const videoCount = await page.locator('#pptx-host video').count();
            console.log('Geraldine video elements on slide 21:',videoCount);
            assert.ok(videoCount>0,'slide 21 must have its embedded video');
            // A downward wheel event after starting playback must go directly
            // to slide 22 and never execute the native media animation again.
            const rect=await page.locator('#pptx-host').boundingBox();
            await page.mouse.move(rect.x+rect.width/2,rect.y+rect.height/2);
            await page.mouse.wheel(0,580);
            await page.waitForFunction(() => document.querySelector('#pptx-host')?.dataset.activeSlideIndex==='21',
              null,{timeout:20000});
            console.log('Real deck: video played once on slide 21; next down-scroll advanced to slide 22.');

            // Reload in the same browser profile, abort all network access to
            // the PPTX, and confirm Cache Storage alone opens the full deck.
            await page.keyboard.press('Escape');
            await page.waitForFunction(() => !document.fullscreenElement,null,{timeout:15000});
            await page.waitForFunction(() => window.__screenWakeLog.releases===1,null,{timeout:15000});
            console.log('Screen wake lock: acquired in fullscreen and released after Escape.');
            let networkDeckRequests=0;
            await page.route('**/assets/presentaciones/mas-duenos-liniers.pptx', route=>{
              networkDeckRequests++;
              return route.abort('failed');
            });
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(() =>
              document.querySelector('#default-availability')?.textContent?.includes('guardada en este dispositivo'),
              null,{timeout:30000});
            assert.equal(await page.locator('#open-default').isEnabled(),true);
            const cachedStart=Date.now();
            await page.locator('#open-default').click();
            await page.locator('#workspace').waitFor({state:'visible',timeout:120000});
            await page.waitForFunction(() => /40 diapositivas/.test(document.querySelector('#file-meta')?.textContent||''),
              null,{timeout:120000});
            assert.equal(networkDeckRequests,0,'cache reuse must not perform HEAD or GET requests');
            await page.waitForFunction(() =>
              document.querySelector('#intro-cache-state')?.textContent?.includes('caché local'),
              null,{timeout:30000});
            assert.equal(introDownloads,introStoredBeforeClick?0:1,
              'a second Liniers opening must reuse the MP4 cache, not redownload');
            await page.waitForFunction(() =>
              document.querySelector('#intro-cache-progress')?.dataset.state==='cached',
              null,{timeout:30000});
            assert.equal(await page.locator('#intro-cache-progress').getAttribute('data-state'),'cached',
              'indicator must recognize local storage on second opening');
            console.log('Introduction caching: second opening uses the saved MP4; no additional GET.');
            console.log('Persistent browser cache: second full 40-slide opening succeeds after reload with PPTX network blocked in '+(Date.now()-cachedStart)+'ms.');

            // Third entry: leave the landing screen visible until the cached
            // slide model/DOM is ready. Clicking must reuse that viewer instantly.
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(() =>
              document.querySelector('#open-default')?.dataset.prepared === 'true',
              null,{timeout:120000});
            assert.equal(await page.locator('#welcome').isVisible(),true);
            assert.equal(await page.locator('#workspace').isVisible(),false,
              'background parse must not replace the landing screen');
            const launchStarted=Date.now();
            await page.locator('#open-default').click();
            await page.waitForFunction(() =>
              /40 diapositivas/.test(document.querySelector('#file-meta')?.textContent||'') &&
              !document.querySelector('#workspace')?.classList.contains('prewarming'),
              null,{timeout:15000});
            const launchMs=Date.now()-launchStarted;
            console.log('Prepared deck: click-to-ready in '+launchMs+'ms; PPTX network requests='+networkDeckRequests);
            assert.ok(launchMs<5000,'click on a pre-parsed deck should avoid repeating the 40-slide build');
            assert.equal(networkDeckRequests,0,'preloaded deck must stay fully local');
          } finally {
            await browser.close();
          }
          JS
