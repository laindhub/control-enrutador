name: Build Android TV APK
on:
  push:
    paths:
      - 'android-tv/**'
      - 'src/tv-media.js'
      - 'test/tv-media.test.js'
      - 'scripts/e2e-android-tv.mjs'
      - '.github/workflows/build-android-tv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The previous assembleDebug used a newly generated debug keystore on
      # every hosted runner, making all published APKs mutually incompatible.
      # Fail closed: NEVER silently publish another randomly signed APK.
      - name: Require permanent signing secrets
        env:
          TV_SIGNING_SECRET: ${{ secrets.TV_SIGNING_SECRET }}
          TV_SIGNING_KEYSTORE_B64: ${{ secrets.TV_SIGNING_KEYSTORE_B64 }}
        run: |
          if [[ -z "$TV_SIGNING_SECRET" || -z "$TV_SIGNING_KEYSTORE_B64" ]]; then
            echo "::error::Set both Actions secrets TV_SIGNING_SECRET and TV_SIGNING_KEYSTORE_B64 (see android-tv/signing/README.md). No random/debug signed APK will be published."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Recover permanent signing key from GitHub Actions secrets
        env:
          TV_SIGNING_SECRET: ${{ secrets.TV_SIGNING_SECRET }}
          TV_SIGNING_KEYSTORE_B64: ${{ secrets.TV_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "TV_SIGNING_STORE_PATH=$RUNNER_TEMP/masduenos-tv-release.p12" >> "$GITHUB_ENV"
          # Never print private key material in workflow output.
          printf '%s' "$TV_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/masduenos-tv-release.p12"
          chmod 600 "$RUNNER_TEMP/masduenos-tv-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/masduenos-tv-release.p12" \
            -storetype PKCS12 -storepass:env TV_SIGNING_SECRET \
            -alias masduenostv > /dev/null
      - run: node --test test/tv-media.test.js
      - name: Install browser simulation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify complete keyboard navigation in Chromium
        run: node scripts/e2e-android-tv.mjs
      - name: Build Android TV release APK with the permanent signing key
        working-directory: android-tv
        env:
          TV_SIGNING_SECRET: ${{ secrets.TV_SIGNING_SECRET }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release APK and pinned signing certificate
        run: |
          set -euo pipefail
          apk="android-tv/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/tv-signing-report.txt"
          pinned=$(tr -d '[:space:]' < android-tv/signing/certificate.sha256)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/tv-signing-report.txt" | head -n 1)
          if [[ -z "$actual" || "$actual" != "$pinned" ]]; then
            echo "::error::Android TV signing certificate changed! Refusing to publish incompatible APK."
            exit 1
          fi
          echo "Permanent APK signature verified: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: masduenos-android-tv-apk
          path: android-tv/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
