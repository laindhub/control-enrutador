plugins { id 'com.android.application' }
android {
    namespace 'io.laind.masduenos.tablet'
    compileSdk 35
    defaultConfig {
        applicationId 'io.laind.masduenos.tablet'
        minSdk 28
        targetSdk 35
        versionCode 18
        versionName '0.7.2'
    }
    // The server directory is also the initial offline copy: one source of names.
    sourceSets { main { assets.srcDirs += ['../../public/tablet'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
