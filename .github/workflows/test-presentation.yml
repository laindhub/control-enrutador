name: Test PPTX presentation viewer
on:
  push:
    paths:
      - 'src/server.js'
      - 'src/official-presentation.js'
      - 'public/js/presentation.js'
      - 'public/js/presentation-source.js'
      - 'public/js/presentation-media.js'
      - 'public/js/presentation-loop.js'
      - 'public/js/presentation-timing.js'
      - 'public/css/presentation.css'
      - 'views/presentation.ejs'
      - 'test/presentation.test.js'
      - 'test/official-presentation.test.js'
      - 'scripts/e2e-presentation.mjs'
      - 'docs/presentacion.md'
      - '.github/workflows/test-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check public/js/presentation-source.js
      - run: node --check public/js/presentation.js
      - run: node --check public/js/presentation-media.js
      - run: node --check public/js/presentation-loop.js
      - run: node --check public/js/presentation-timing.js
      - run: node --test test/presentation.test.js test/official-presentation.test.js
      - name: Verify pinned browser engine is available
        run: |
          node --input-type=module -e "
            const response = await fetch('https://esm.sh/pptx-vanilla-viewer@3.31.1?bundle');
            if (!response.ok) throw Error('PPTX viewer CDN returned HTTP ' + response.status);
            const code = await response.text();
            if (!code.includes('pptx-vanilla-viewer')) throw Error('Unexpected viewer module response');
            console.log('Pinned PPTX viewer module available (' + code.length + ' bytes)');
          "
      - run: npm run check
      - name: Verify presentation and representative integration regressions
        run: node --test test/presentation.test.js test/presenter-admin.test.js test/session-persistence.test.js test/android-navigation.test.js
      - name: Install E2E fixture generator and Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pptxgenjs
          npx playwright install --with-deps chromium
      - name: Open a real PPTX in headless Chromium
        run: node scripts/e2e-presentation.mjs