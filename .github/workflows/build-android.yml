name: Build Android unsigned APK
on:
  push:
    paths:
      - 'android/**'
      - 'test/android-navigation.test.js'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Inspect preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" || true
          ls -1 "$ANDROID_HOME/build-tools" || true
      - name: Verify Android navigation and branded error state
        run: node --test test/android-navigation.test.js
      - name: Compile release without signing key
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: masduenos-salon-1.2.6-unsigned
          path: android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
