name: Build Más Dueños TV with preloaded media
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/package-tv-bundle.mjs'
      - 'scripts/build-tv-pptx-engine.mjs'
      - 'scripts/tv-pptx-engine-entry.mjs'
      - 'scripts/smoke-tv-offline-engine.mjs'
      - 'scripts/pre-render-tv-slides.mjs'
      - 'scripts/assemble-tv-39-slide.mjs'
      - 'scripts/package-tv-bundle.mjs'
      - 'scripts/update-tv-marketing.py'
      - 'android-tv/source/presentation-39/**'
      - 'android-tv/app/src/main/assets/presentation-timing.js'
      - 'android-tv/app/src/main/assets/tv.js'
      - 'scripts/e2e-android-tv.mjs'
      - 'android-tv/app/src/main/java/io/laind/masduenos/tv/TvAssetStore.java'
      - 'android-tv/app/build.gradle'
      - '.github/workflows/build-android-tv-bundled.yml'
permissions:
  contents: write
jobs:
  bundled-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: node --test test/tv-media.test.js
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact PPTX engine and offline bundler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --legacy-peer-deps pptx-vanilla-viewer@3.31.1 esbuild@0.25.12 @fontsource/carlito@5.3.0
      - name: Bundle PPTX viewer into Android local assets
        run: node scripts/build-tv-pptx-engine.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Android TV navigation
        run: node scripts/e2e-android-tv.mjs
      - name: Reconstruct approved 39-slide PPTX and fetch original intro MP4
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            rm -rf android-tv/app/src/main/assets/bundle
            node scripts/assemble-tv-39-slide.mjs
            if node scripts/package-tv-bundle.mjs; then
              echo "SHA-256 verified both media assets on attempt $attempt"
              exit 0
            fi
            echo "::warning::Hostinger transfer interrupted (attempt $attempt of 4). Retrying."
            sleep $((attempt * 4))
          done
          echo "::error::Unable to verify both original media downloads after four retries."
          exit 1
      - name: Verify exact 39-slide source, media and checksum
        run: |
          python -m pip install --quiet python-pptx
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json,zipfile
          from pptx import Presentation
          root=Path("android-tv/app/src/main/assets/bundle")
          deck=(root/"presentation.pptx").read_bytes()
          manifest=json.loads((root/"manifest.json").read_text())
          digest=sha256(deck).hexdigest()
          assert digest=="175c2002b3b2f7f5d9c42412bfb770514f1c03fc924b5833cc49bb63e1d53f12"
          assert len(deck)==35735002
          assert manifest["presentation"]["sha256"]==digest
          assert manifest["presentation"]["size"]==len(deck)
          prs=Presentation(root/"presentation.pptx")
          assert len(prs.slides)==39, f"Expected 39 slides, got {len(prs.slides)}"
          with zipfile.ZipFile(root/"presentation.pptx") as z:
            assert z.testzip() is None
            assert "ppt/media/media1.mp4" in z.namelist(), "Geraldine MP4 missing"
          print("APPROVED SOURCE VERIFIED: 39 slides, without $200000 slide; Geraldine media preserved")
          PY
      - name: Pre-render 39 approved slide images, preserving instant navigation
        run: node scripts/pre-render-tv-slides.mjs
      - name: Verify actual PowerPoint and cached slide navigation offline
        run: node scripts/smoke-tv-offline-engine.mjs
      - name: Build Android TV APK including both files and local PPTX engine
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify both media payloads and APK signature
        run: |
          set -euo pipefail
          apk="android-tv/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -Z -1 "$apk" | grep -Fx 'assets/pptx-viewer-offline.js'
          unzip -Z -1 "$apk" | grep -Fx 'assets/tv-fonts.css'
          unzip -Z -1 "$apk" | grep -Fx 'assets/slides/manifest.json'
          for n in $(seq 1 39); do
            unzip -Z -1 "$apk" | grep -Fx "assets/slides/slide-$(printf '%03d' "$n").jpg"
          done
          for name in presentation.pptx introduccion.mp4 manifest.json; do
            unzip -Z -1 "$apk" | grep -Fx "assets/bundle/$name"
          done
          signer=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify "$apk"
          ls -lh "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: masduenos-android-tv-offline-complete-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish the direct APK for TCL installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          direct="$RUNNER_TEMP/MasDuenosTV_1.6.18_39_Diapositivas.apk"
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk "$direct"
          sourceDeck="$RUNNER_TEMP/MasDuenos_Liniers_39_Diapositivas.pptx"
          cp android-tv/app/src/main/assets/bundle/presentation.pptx "$sourceDeck"
          tag="masduenos-tv-1.6.18-sin-200mil"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$direct" "$sourceDeck" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$direct" "$sourceDeck" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Más Dueños TV 1.6.18 — 39 diapositivas (sin $200.000)" \
              --notes "Instalador completo sin Wi-Fi, generado desde el PowerPoint exacto del usuario con 39 diapositivas. Se eliminó la lámina de $200.000. Mantiene Geraldine, la introducción, las cifras actualizadas, imágenes precalculadas, navegación rápida y Menú Pro."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
