name: Publish complete Más Dueños TV APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-android-tv-complete.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the already verified 1.6.12 complete APK
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 38920268262 \
            --repo "$GITHUB_REPOSITORY" \
            --name masduenos-android-tv-offline-complete-apk \
            --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/MasDuenosTV_1.6.12_Completa.apk
      - name: Recheck required PPTX and introduction files
        run: |
          set -euo pipefail
          apk="dist/MasDuenosTV_1.6.12_Completa.apk"
          for name in presentation.pptx introduccion.mp4 manifest.json; do
            unzip -Z -1 "$apk" | grep -Fx "assets/bundle/$name"
          done
          unzip -p "$apk" assets/bundle/manifest.json
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Publish one direct APK on GitHub Releases
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          tag="masduenos-tv-1.6.12-completa"
          apk="dist/MasDuenosTV_1.6.12_Completa.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Más Dueños TV 1.6.12 — APK completo" \
              --notes "Instalador APK único de Más Dueños TV 1.6.12 con las 40 diapositivas PowerPoint y el video de introducción originales ya incluidos. No requiere descargar esos dos archivos al iniciar. La firma es debug de GitHub Actions: si el televisor rechaza la actualización por diferencia de firma, desinstalá la anterior e instalá este APK."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
