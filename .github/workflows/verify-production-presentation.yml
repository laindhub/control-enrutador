name: Verify production presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-presentation.yml'
      - 'src/official-presentation.js'
      - 'src/server.js'
      - 'public/js/presentation.js'
      - 'public/js/presentation-source.js'
      - 'public/js/presentation-cache.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed file, SHA-256 and browser launch from the default card
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';

          const base = 'https://masduenos.laind.io';
          const url = base + '/assets/presentaciones/mas-duenos-liniers.pptx';
          const sha = 'bdb35bfa366b7c2570a36a0d5b1172836765d50796a8e772345b5a5ccf6f25c7';
          const bytes = 34796967;
          let ready = false;
          for (let attempt=1; attempt<=12; attempt++) {
            try {
              const response = await fetch(url, {method:'HEAD', cache:'no-store',signal:AbortSignal.timeout(25000)});
              const mime = response.headers.get('content-type') || '';
              console.log(`Production HEAD attempt ${attempt}: HTTP ${response.status}, ${mime}`);
              if (response.ok && mime.includes('application/vnd.openxmlformats-officedocument.presentationml.presentation')) {
                ready = true;
                break;
              }
            } catch (error) {
              console.log(`Production HEAD attempt ${attempt}: ${error.message}`);
            }
            if (attempt<12) await new Promise(resolve => setTimeout(resolve,15000));
          }
          assert.ok(ready, 'Production did not expose the verified PPTX within the retry window');

          // Deploys can momentarily serve the app's 200/HTML warming page, even after a valid HEAD.
          let verified = false;
          for (let attempt=1; attempt<=15; attempt++) {
            try {
              const response = await fetch(url, {signal:AbortSignal.timeout(120000), cache:'no-store'});
              const mime = response.headers.get('content-type') || '';
              const data = Buffer.from(await response.arrayBuffer());
              console.log(`Production GET attempt ${attempt}: HTTP ${response.status}, ${mime}, ${data.length} bytes`);
              if (response.ok && mime.includes('application/vnd.openxmlformats-officedocument.presentationml.presentation') && data.length === bytes) {
                assert.equal(createHash('sha256').update(data).digest('hex'),sha,'PPTX bytes differ from original');
                verified = true;
                break;
              }
            } catch (error) {
              console.log(`Production GET attempt ${attempt}: ${error.message}`);
            }
            if (attempt<15) await new Promise(resolve => setTimeout(resolve,10000));
          }
          assert.ok(verified, 'Production GET never returned the complete original PPTX');
          console.log('Production GET: exact SHA-256, 40-slide PPTX source bytes verified.');

          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            page.on('pageerror',error => console.error('Browser error:',error.message));
            let pageReady = false;
            for (let attempt=1; attempt<=8; attempt++) {
              const result=await page.goto(base+'/presentacion',{waitUntil:'domcontentloaded',timeout:60000});
              if (result?.status()===200 && await page.locator('#dropzone').isVisible()) {
                pageReady = true;
                break;
              }
              console.log(`Presentation page not ready (attempt ${attempt})`);
              if (attempt<8) await new Promise(resolve => setTimeout(resolve,10000));
            }
            assert.ok(pageReady,'presentation page must load after deployment');
            await page.waitForFunction(() => document.querySelector('#default-availability')?.textContent?.includes('Lista para abrir'),null,{timeout:60000});
            await page.locator('#open-default').click();
            await page.locator('#workspace').waitFor({state:'visible',timeout:120000});
            await page.waitForFunction(() => /40 diapositivas/.test(document.querySelector('#file-meta')?.textContent||''),null,{timeout:120000});
            assert.equal(await page.locator('#file-name').textContent(),'Nueva - Más dueños.pptx');
            assert.equal(await page.locator('#start').isVisible(),true);
            console.log('Browser: default card opens the 40-slide deck without file selection; upload card remains available.');

            // Real-deck regression: slide 21 contains playFrom(0), not two
            // physical slides. One advance plays Geraldine, the next leaves.
            await page.locator('#start').click();
            await page.waitForFunction(() => Boolean(document.fullscreenElement),null,{timeout:15000});
            for (let index=1;index<=20;index++) {
              await page.keyboard.press('ArrowDown');
              await page.waitForFunction(i => document.querySelector('#pptx-host')?.dataset.activeSlideIndex===String(i),
                index,{timeout:30000});
            }
            assert.equal(await page.locator('#pptx-host').getAttribute('data-active-slide-index'),'20');
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(1100);
            assert.equal(await page.locator('#pptx-host').getAttribute('data-active-slide-index'),'20',
              'first advance on video slide must play without changing slides');
            const videoCount = await page.locator('#pptx-host video').count();
            console.log('Geraldine video elements on slide 21:',videoCount);
            assert.ok(videoCount>0,'slide 21 must have its embedded video');
            // A downward wheel event after starting playback must go directly
            // to slide 22 and never execute the native media animation again.
            const rect=await page.locator('#pptx-host').boundingBox();
            await page.mouse.move(rect.x+rect.width/2,rect.y+rect.height/2);
            await page.mouse.wheel(0,580);
            await page.waitForFunction(() => document.querySelector('#pptx-host')?.dataset.activeSlideIndex==='21',
              null,{timeout:20000});
            console.log('Real deck: video played once on slide 21; next down-scroll advanced to slide 22.');

            // Reload in the same browser profile, abort all network access to
            // the PPTX, and confirm Cache Storage alone opens the full deck.
            await page.keyboard.press('Escape');
            let networkDeckRequests=0;
            await page.route('**/assets/presentaciones/mas-duenos-liniers.pptx', route=>{
              networkDeckRequests++;
              return route.abort('failed');
            });
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(() =>
              document.querySelector('#default-availability')?.textContent?.includes('guardada en este dispositivo'),
              null,{timeout:30000});
            assert.equal(await page.locator('#open-default').isEnabled(),true);
            const cachedStart=Date.now();
            await page.locator('#open-default').click();
            await page.locator('#workspace').waitFor({state:'visible',timeout:120000});
            await page.waitForFunction(() => /40 diapositivas/.test(document.querySelector('#file-meta')?.textContent||''),
              null,{timeout:120000});
            assert.equal(networkDeckRequests,0,'cache reuse must not perform HEAD or GET requests');
            console.log('Persistent browser cache: second full 40-slide opening succeeds after reload with PPTX network blocked in '+(Date.now()-cachedStart)+'ms.');
          } finally {
            await browser.close();
          }
          JS
