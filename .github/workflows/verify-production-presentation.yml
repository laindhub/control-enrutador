name: Verify production presentation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed file, SHA-256 and browser launch from the default card
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {chromium} from 'playwright';

          const base = 'https://masduenos.laind.io';
          const url = base + '/assets/presentaciones/mas-duenos-liniers.pptx';
          const sha = 'bdb35bfa366b7c2570a36a0d5b1172836765d50796a8e772345b5a5ccf6f25c7';
          const bytes = 34796967;
          let ready = false;
          for (let attempt=1; attempt<=12; attempt++) {
            try {
              const response = await fetch(url, {method:'HEAD', cache:'no-store',signal:AbortSignal.timeout(25000)});
              const mime = response.headers.get('content-type') || '';
              console.log(`Production HEAD attempt ${attempt}: HTTP ${response.status}, ${mime}`);
              if (response.ok && mime.includes('application/vnd.openxmlformats-officedocument.presentationml.presentation')) {
                ready = true;
                break;
              }
            } catch (error) {
              console.log(`Production HEAD attempt ${attempt}: ${error.message}`);
            }
            if (attempt<12) await new Promise(resolve => setTimeout(resolve,15000));
          }
          assert.ok(ready, 'Production did not expose the verified PPTX within the retry window');

          const response = await fetch(url, {signal:AbortSignal.timeout(120000), cache:'no-store'});
          assert.equal(response.status,200,'GET must return the original PPTX');
          const data = Buffer.from(await response.arrayBuffer());
          assert.equal(data.length,bytes,'GET must return the complete original file');
          assert.equal(createHash('sha256').update(data).digest('hex'),sha,'PPTX bytes differ from original');
          console.log('Production GET: exact SHA-256, 40-slide PPTX source bytes verified.');

          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            page.on('pageerror',error => console.error('Browser error:',error.message));
            const result=await page.goto(base+'/presentacion',{waitUntil:'domcontentloaded',timeout:60000});
            assert.equal(result.status(),200);
            assert.equal(await page.locator('#dropzone').isVisible(),true,'local upload card remains present');
            await page.waitForFunction(() => document.querySelector('#default-availability')?.textContent?.includes('Lista para abrir'),null,{timeout:60000});
            await page.locator('#open-default').click();
            await page.locator('#workspace').waitFor({state:'visible',timeout:120000});
            await page.waitForFunction(() => /40 diapositivas/.test(document.querySelector('#file-meta')?.textContent||''),null,{timeout:120000});
            assert.equal(await page.locator('#file-name').textContent(),'Nueva - Más dueños.pptx');
            assert.equal(await page.locator('#start').isVisible(),true);
            console.log('Browser: default card opens the 40-slide deck without file selection; upload card remains available.');
          } finally {
            await browser.close();
          }
          JS
