plugins { id 'com.android.application' }
android {
    namespace 'io.laind.masduenos.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'io.laind.masduenos.tv'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '1.6.14'
    }
    // The bundled offline edition embeds a large PPTX and MP4. These are
    // already ZIP/MP4 files; avoid recompressing them while building the APK.
    androidResources {
        noCompress += ['pptx', 'mp4']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
